name: Deploy Aethelgard MUD to GitHub Pages

on:
  workflow_run:
    workflows: ["Verify game and local AI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  configuration:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check whether this repository uses GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python - <<'CHECK'
          import json, os, urllib.request, urllib.error
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  site = json.load(response)
              enabled = site.get("build_type") == "workflow"
              summary = "GitHub Pages is configured for Actions." if enabled else "Pages uses another publishing source. Select GitHub Actions in Settings / Pages to use this workflow."
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              enabled = False
              summary = "GitHub Pages is not configured. Deployment is skipped; verification and downloadable packages are available in the Verify workflow. To publish a Pages frontend, enable Settings / Pages / GitHub Actions. Cloudflare Worker deployment is separate."
          if enabled:
              head_url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/main"
              head_request = urllib.request.Request(head_url, headers=dict(req.header_items()))
              with urllib.request.urlopen(head_request, timeout=30) as response:
                  current_head = json.load(response)["sha"]
              if current_head != os.environ["VERIFIED_SHA"]:
                  enabled = False
                  summary = "This verification belongs to an older revision. Deployment is skipped so it cannot replace a newer main build."
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"enabled={str(enabled).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary + "\n")
          CHECK
  deploy:
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - name: Build and verify the selected revision
        run: |
          npm run build
          python tests/verify_mud.py
          mkdir -p dist/assets dist/models
          cp index.html open_world_mud.html sw.js build-info.json dist/
          cp assets/game.css assets/ai-worker.js dist/assets/
          cp models/registry.json dist/models/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Confirm the verified revision is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          python - <<'CHECK'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/main"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req, timeout=30) as response:
              current = json.load(response)["sha"] == os.environ["VERIFIED_SHA"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"current={str(current).lower()}\n")
          if not current:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write("Main advanced while this build was preparing. The older deployment is skipped.\n")
          CHECK
      - uses: actions/deploy-pages@v4
        if: steps.current.outputs.current == 'true'
        id: deployment
