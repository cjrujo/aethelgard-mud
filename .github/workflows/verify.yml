name: Verify game and local AI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
jobs:
  game-and-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code -- index.html open_world_mud.html sw.js assets/game.css build-info.json cloudflare-worker/build-info.js
      - run: python tests/verify_mud.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node tests/browser-update.mjs
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-verification
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: aethelgard-source-game
          path: dist-release/*-source.zip
  worker-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python src/build_mud_game.py --check
      - name: Install the pinned local Worker runtime
        run: npm install --prefix "$RUNNER_TEMP/aethelgard-wrangler" --no-save --package-lock=false --no-audit --no-fund wrangler@4.152.0
      - name: Verify receipts survive a complete local Worker restart
        env:
          WRANGLER_SEND_METRICS: "false"
        run: WRANGLER_CLI="$RUNNER_TEMP/aethelgard-wrangler/node_modules/wrangler/wrangler-dist/cli.js" node tests/worker-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-runtime-verification
          path: test-results/worker-runtime.json
  real-local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: python tools/prepare_offline.py --model qwen-0.6b
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --model
      - run: python tools/package_release.py --model qwen-0.6b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-browser-model
          path: test-results/browser.json
      - uses: actions/upload-artifact@v4
        with:
          name: aethelgard-qwen-offline
          path: dist-release/*-offline.zip
          compression-level: 0
